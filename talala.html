<script>
  // Выставляем тему до первой отрисовки: иначе страница мигнёт фоном чужой
  // темы, а браузер успеет скачать ненужную картинку (они по 1.8 МБ).
  //
  // Приоритет: ?theme=light|dark → тема Telegram → системная.
  // Telegram свои параметры кладёт в хеш (#tgWebAppData=...), так что
  // query-строка свободна и конфликта нет.
  try {
    var forced = new URLSearchParams(location.search).get('theme');
    window.__forcedTheme = (forced === 'light' || forced === 'dark') ? forced : null;

    var w = window.Telegram && window.Telegram.WebApp;
    // Вне Telegram colorScheme всегда 'light' и перебил бы системную тёмную
    // тему, поэтому берём его только когда мы действительно внутри клиента.
    var theme = window.__forcedTheme
      || ((w && (w.initData || w.platform !== 'unknown')) ? w.colorScheme : null);

    if (theme) document.documentElement.dataset.theme = theme;
  } catch (e) {}
</script>

<style>
  :root {
    /* Fallback-палитра для обычного браузера.
       Внутри Telegram эти же переменные перезапишет telegram-web-app.js. */
    --bg:        var(--tg-theme-bg-color, #ffffff);
    --text:      var(--tg-theme-text-color, #000000);
    --hint:      var(--tg-theme-hint-color, #707579);
    --link:      var(--tg-theme-link-color, #2481cc);
    --btn:       var(--tg-theme-button-color, #2481cc);
    --btn-text:  var(--tg-theme-button-text-color, #ffffff);
    --section:   var(--tg-theme-secondary-bg-color, #f4f4f5);
    --danger:    var(--tg-theme-destructive-text-color, #df3f40);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      var(--tg-theme-bg-color, #17212b);
      --text:    var(--tg-theme-text-color, #f5f5f5);
      --hint:    var(--tg-theme-hint-color, #708499);
      --section: var(--tg-theme-secondary-bg-color, #232e3c);
    }
  }
  /* data-theme важнее системной темы: так ?theme=... переключает не только
     картинку фона, но и всю палитру. Внутри Telegram это ни на что не влияет —
     там --tg-theme-* заданы и fallback-значения не используются. */
  html[data-theme="light"] {
    --bg:      var(--tg-theme-bg-color, #ffffff);
    --text:    var(--tg-theme-text-color, #000000);
    --hint:    var(--tg-theme-hint-color, #707579);
    --section: var(--tg-theme-secondary-bg-color, #f4f4f5);
  }
  html[data-theme="dark"] {
    --bg:      var(--tg-theme-bg-color, #17212b);
    --text:    var(--tg-theme-text-color, #f5f5f5);
    --hint:    var(--tg-theme-hint-color, #708499);
    --section: var(--tg-theme-secondary-bg-color, #232e3c);
  }

  * { box-sizing: border-box; }

  /* Запрет зума. touch-action: pan-x pan-y оставляет прокрутку, но убирает
     щипок двумя пальцами и зум по двойному тапу. text-size-adjust не даёт
     мобильному движку самовольно раздувать шрифт. */
  html {
    touch-action: pan-x pan-y;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    margin: 0;
    /* Три объявления подряд: браузер берёт последнее, которое понимает.
       Внутри Telegram правильная высота — только --tg-viewport-stable-height,
       потому что 100vh там врёт на величину свёрнутой шапки. */
    min-height: 100vh;
    min-height: 100dvh;
    min-height: var(--tg-viewport-stable-height, 100dvh);
    display: flex;
    flex-direction: column;
    padding: 16px 14px 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* main забирает всё свободное место, поэтому футер всегда у нижнего края,
     даже когда контента мало. При длинном вопросе sticky держит кнопку на виду. */
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #screen { flex: 1; display: flex; flex-direction: column; }

  /* ---------- фон ----------
     Отдельный фиксированный слой, а не background-attachment: fixed — тот
     в WebView на iOS дёргается при скролле. ::after приглушает узор, иначе
     текст поверх него не читается; крутить прозрачность здесь. */
  .bg {
    position: fixed; inset: 0; z-index: -1;
    background-image: url('talala/light.webp');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .bg::after {
    content: ''; position: absolute; inset: 0;
    background: var(--bg);
    opacity: .58;   /* ← сила приглушения узора; меньше — ярче фон, хуже текст */
  }
  @media (prefers-color-scheme: dark) {
    .bg { background-image: url('talala/dark.webp'); }
  }
  /* Выбор Telegram важнее системного: data-theme ставится из colorScheme. */
  html[data-theme="light"] .bg { background-image: url('talala/light.webp'); }
  html[data-theme="dark"]  .bg { background-image: url('talala/dark.webp'); }

  /* ---------- тест ---------- */

  .progress {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 13px; color: var(--hint);
    margin-bottom: 14px;
  }
  .dots { display: flex; gap: 4px; flex-wrap: wrap; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: color-mix(in srgb, var(--hint) 35%, transparent);
  }
  .dot.done { background: var(--btn); }

  /* Приветствие занимает всё свободное место над футером и центрируется в нём. */
  .intro {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    text-align: center; padding: 8px 4px 24px;
  }
  .intro h1 {
    font-size: 28px; font-weight: 700; line-height: 1.2;
    margin: 0 0 12px;
  }
  .intro p { color: var(--hint); font-size: 15px; margin: 0; }

  .question {
    font-size: 20px; font-weight: 600; line-height: 1.3;
    margin: 0 0 18px;
  }

  .option {
    display: block; width: 100%; text-align: left;
    background: var(--section); color: var(--text);
    border: 2px solid transparent; border-radius: 12px;
    padding: 13px 15px; margin-bottom: 9px;
    font: inherit; cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .option:active { opacity: .75; }
  .option.selected {
    border-color: var(--btn);
    background: color-mix(in srgb, var(--btn) 14%, var(--section));
  }

  /* ---------- результат ---------- */

  .result {
    text-align: center;
    padding: 10px 0 18px;
  }
  /* Пропорции у картинок разные (0.56..0.70), поэтому высота по содержимому,
     а не фиксированный aspect-ratio — иначе лица обрезало бы. */
  .result .hero {
    display: block; width: 100%; max-width: 240px; height: auto;
    margin: 0 auto; border-radius: 12px;
    background: color-mix(in srgb, var(--hint) 15%, transparent);
  }
  .result .hero-fallback {
    display: grid; place-items: center;
    width: 100%; max-width: 240px; aspect-ratio: 2 / 3;
    margin: 0 auto; border-radius: 12px;
    background: color-mix(in srgb, var(--hint) 15%, transparent);
    color: var(--hint); font-size: 13px; text-align: center; padding: 12px;
  }
  .result .who {
    font-size: 13px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--hint); margin: 14px 0 4px;
  }
  .result .name { font-size: 25px; font-weight: 700; margin: 0 0 10px; }
  /* Длинный текст по центру читается плохо, поэтому описание — по левому краю,
     а имя и подпись над ним остаются центрированными. */
  .result .desc { text-align: left; margin: 14px 0 0; }
  .result .desc p {
    color: var(--text); font-size: 15px; margin: 0 0 10px;
  }
  .result .desc p:last-child { margin-bottom: 0; }

  /* ---------- общее ---------- */

  /* Кнопка всегда на экране: липнет к низу, контент уезжает под неё.
     Нижний отступ с safe-area, чтобы не лезла под домашнюю полоску iPhone. */
  .footer {
    position: sticky; bottom: 0;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
    margin: 0 -14px;
    background: var(--bg);
  }
  .footer::before {
    content: ''; display: block;
    position: absolute; left: 0; right: 0; top: -18px; height: 18px;
    background: linear-gradient(to top, var(--bg), transparent);
    pointer-events: none;
  }

  /* Вторичные кнопки: контуром, чтобы главная в футере осталась главной. */
  /* Снизу отступ больше, чем кажется нужным: над липким футером лежит
     градиентная подложка высотой 18px, и без запаса кнопки уходят под неё. */
  .share { display: flex; gap: 8px; margin: 4px 0 28px; }
  .share button {
    flex: 1; padding: 12px 10px;
    background: var(--bg); color: var(--btn);
    border: 1.5px solid var(--btn); border-radius: 11px;
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .share button:active { opacity: .6; }

  .primary {
    display: block; width: 100%;
    padding: 14px;
    background: var(--btn); color: var(--btn-text);
    border: none; border-radius: 11px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .primary:active:not(:disabled) { opacity: .75; }
  .primary:disabled { opacity: .35; cursor: default; }

  .banner {
    background: color-mix(in srgb, var(--danger) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
    color: var(--danger);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 16px;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<div id="banner"></div>

<main>

  <div id="screen"></div>

<script>

const tg = window.Telegram?.WebApp;

if (!tg) {
  document.getElementById('banner').innerHTML =
    'SDK не загрузился: <code>window.Telegram.WebApp</code> отсутствует.';
  throw new Error('Telegram WebApp SDK not available');

/* Safari и WKWebView игнорируют и user-scalable=no, и touch-action,
   поэтому щипок там гасится только отменой собственных gesture-событий.
   Отдельно — Ctrl+колесо: так зумят трекпадом в десктопном клиенте. */
for (const type of ['gesturestart', 'gesturechange', 'gestureend']) {
  document.addEventListener(type, e => e.preventDefault(), { passive: false });
}
document.addEventListener('wheel', e => {
  if (e.ctrlKey) e.preventDefault();
}, { passive: false });

tg.ready();    // говорим клиенту «я отрисовался», он убирает лоадер
tg.expand();   // разворачиваем на всю доступную высоту

// Без этого вертикальный свайп по странице перехватывается клиентом и
// сворачивает или закрывает приложение, не доходя до скролла. Особенно
// заметно на длинном тексте результата. Метод появился в Bot API 7.7,
// на старых клиентах его просто нет.
// Закрыть свайпом за шапку приложения по-прежнему можно — это by design.
if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();

/* ---------- проверка конфига ---------- */
// Опечатка в ключе персонажа иначе молча съест очки.
(function validateConfig() {
  const known = new Set(Object.keys(CHARACTERS));
  for (const key of TIEBREAK) {
    if (!known.has(key)) console.error(`TIEBREAK: неизвестный персонаж "${key}"`);
  }
  for (const key of known) {
    if (!TIEBREAK.includes(key)) console.error(`TIEBREAK: персонаж "${key}" не указан`);
  }
  for (const [key, c] of Object.entries(CHARACTERS)) {
    if (!c.img) console.error(`Герою "${key}" не задан img`);
    if (!c.desc) console.warn(`У героя "${key}" пустой desc — на результате не будет текста`);
  }
  // Герой, которого нет ни в одном варианте, выпасть не может никогда.
  const used = new Set();
  for (const q of QUESTIONS) for (const a of q.answers) for (const k of Object.keys(a.points || {})) used.add(k);
  for (const key of known) {
    if (!used.has(key)) console.warn(`Герой "${key}" не встречается ни в одном варианте — он недостижим`);
  }
  QUESTIONS.forEach((q, qi) => {
    q.answers.forEach((a, ai) => {
      const entries = Object.entries(a.points || {});
      if (!entries.length) console.error(`Вопрос ${qi + 1}, вариант ${ai + 1}: пустой points`);
      for (const [key, weight] of entries) {
        if (!known.has(key)) console.error(`Вопрос ${qi + 1}, вариант ${ai + 1}: неизвестный герой "${key}"`);
        if (!Number.isFinite(weight) || weight <= 0) console.error(`Вопрос ${qi + 1}, вариант ${ai + 1}: вес "${key}" должен быть положительным числом, а не ${weight}`);
      }
    });
  });
})();

/* ---------- состояние ---------- */

const INTRO = -1;

const state = {
  step: INTRO,      // INTRO → приветствие; 0..N-1 → вопрос; N → результат
  picked: [],       // picked[i] = индекс выбранного варианта в вопросе i
  shared: null,     // ключ героя, если пришли по ссылке с ?startapp=
  startedAt: 0,     // Date.now() начала прохождения — для длительности теста
};

/* Результат по ссылке. Telegram кладёт значение startapp в start_param;
   query-параметр — тот же механизм для проверки в браузере.
   Неизвестный ключ игнорируем, иначе чужая ссылка сломала бы экран. */
(function readStartParam() {
  let key;
  try {
    key = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
    if (!key) key = new URLSearchParams(location.search).get('startapp');
  } catch (e) { return; }
  if (key && Object.prototype.hasOwnProperty.call(CHARACTERS, key)) state.shared = key;
})();

/* ---------- аналитика ----------
   Mixpanel подключён в <head>. Всё идёт через analytics.track(), который
   глушит любые ошибки: упавшая аналитика не должна ронять тест. Если убрать
   сниппет из <head>, функции молча станут пустышками — это и есть выключатель.

   distinct_id берём из id пользователя Telegram, а не из хранилища браузера:
   WebView чистит его между запусками, и один человек иначе расползается на
   десяток анонимов, а с одного id видно все заходы и с телефона, и с десктопа.
   initDataUnsafe не проверен подписью, но для аналитики это допустимо —
   подделывать себе же статистику смысла нет. */

const analytics = (() => {
  if (typeof mixpanel === 'undefined') return { track() {}, refresh() {} };

  // Прилипают ко всем событиям — потом можно резать воронку по платформе и теме.
  const superProps = () => ({
    tg_platform: tg.platform,
    tg_version: tg.version,
    color_scheme: document.documentElement.dataset.theme || tg.colorScheme,
    inside_telegram: Boolean(tg.initData) || tg.platform !== 'unknown',
    quiz_questions: QUESTIONS.length,
  });

  // identify() и профиль пользователя — в <head>, сразу после init.
  // Здесь только то, что зависит от конфига теста и темы: и то и другое
  // к моменту init ещё не готово.
  try { mixpanel.register(superProps()); } catch (e) { /* молчим */ }

  return {
    track(name, props) {
      try { mixpanel.track(name, props); } catch (e) { /* молчим */ }
    },
    // Тему можно переключить, не выходя из приложения.
    refresh() {
      try { mixpanel.register(superProps()); } catch (e) { /* молчим */ }
    },
  };
})();

analytics.track('App Opened', {
  entry: state.shared ? 'shared_link' : 'direct',
  shared_hero: state.shared ? CHARACTERS[state.shared].name : null,
});

/* ---------- главная кнопка ----------
   Своя кнопка в футере, а не нативная MainButton: она видна всегда и
   выглядит одинаково в Telegram и в браузере. Когда действие недоступно,
   кнопка не исчезает, а гаснет — экран не прыгает.
   Обработчик один на всё время жизни, действие берётся из primary.action. */

const domPrimary = document.getElementById('primary');

const primary = {
  action: null,
  set(text, action) {
    this.action = action || null;
    domPrimary.textContent = text;
    domPrimary.disabled = !action;
  },
  fire() { this.action?.(); },
};

domPrimary.addEventListener('click', () => primary.fire());

/* ---------- ссылки и шеринг ---------- */

// Ссылка, открывающая результат конкретного героя.
function resultLink(key) {
  if (BOT_USERNAME && APP_SHORT_NAME) {
    return `https://t.me/${BOT_USERNAME}/${APP_SHORT_NAME}?startapp=${key}`;
  }
  const url = new URL(location.href);
  url.hash = '';
  url.searchParams.set('startapp', key);
  return url.href;
}

function testLink() {
  return `https://t.me/${BOT_USERNAME}/${APP_SHORT_NAME}`;
}

// Пересылка в чат: нативная шторка Telegram, сообщение уходит от имени
// пользователя. Вне Telegram (версия 6.0) открываем ссылку обычной вкладкой,
// чтобы кнопку можно было проверить в браузере.
function shareToChat(key) {
  const character = CHARACTERS[key];
  trackShare('chat', key);
  const url = 'https://t.me/share/url'
    + '?url=' + encodeURIComponent(testLink())
    + '&text=' + encodeURIComponent(`Я — ${character.name}. А ты кто?`);
  if (tg.isVersionAtLeast('6.1')) tg.openTelegramLink(url);
  else window.open(url, '_blank', 'noopener');
}

// Сторис: media_url должен быть абсолютным HTTPS-адресом.
// widget_link доступен только премиум-подписчикам, поэтому добавляем его
// условно — иначе у остальных вызов отвалится.
function shareStory(key) {
  const character = CHARACTERS[key];
  trackShare('story', key);
  const params = {};
  const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (user) {
    params.widget_link = {
      url: testLink(),
      name: `Я — ${character.name}\n\n${QUIZ_TITLE}`,
    };
  }
  tg.shareToStory(new URL(character.img, location.href).href, params);
}

/* Событие отправляем до вызова Telegram, а не после: оба вызова сворачивают
   WebView, и код после них может не успеть выполниться. Запрос с
   batch_requests: false уходит сразу, так что порядок именно такой. */
function trackShare(method, key) {
  analytics.track('Result Shared', {
    method,                                   // 'chat' | 'story'
    hero: key,
    hero_name: CHARACTERS[key].name,
    own_result: !state.shared,                // false — делится чужим из ссылки
  });
}

/* ---------- подсчёт очков ---------- */

function tally() {
  const scores = {};
  for (const key of Object.keys(CHARACTERS)) scores[key] = 0;
  state.picked.forEach((answerIndex, questionIndex) => {
    const points = QUESTIONS[questionIndex].answers[answerIndex].points;
    for (const [key, weight] of Object.entries(points)) {
      scores[key] += weight;
    }
  });
  return scores;
}

// Идём в порядке TIEBREAK и меняем лидера только при строгом превосходстве,
// поэтому при равенстве очков побеждает тот, кто объявлен раньше.
function leader(scores) {
  return TIEBREAK.reduce((best, key) => (scores[key] > scores[best] ? key : best), TIEBREAK[0]);
}

/* ---------- отрисовка ---------- */

const screen = document.getElementById('screen');
const progressBox = document.getElementById('progress');

function haptic(kind) {
  try {
    if (kind === 'select') tg.HapticFeedback.selectionChanged();
    else tg.HapticFeedback.notificationOccurred('success');
  } catch (_) { /* вне Telegram молчим */ }
}

function renderProgress() {
  progressBox.textContent = '';
  if (state.shared || state.step === INTRO || state.step >= QUESTIONS.length) return;

  const label = document.createElement('span');
  label.textContent = `Вопрос ${state.step + 1} из ${QUESTIONS.length}`;
  const dots = document.createElement('div');
  dots.className = 'dots';
  for (let i = 0; i < QUESTIONS.length; i++) {
    const dot = document.createElement('div');
    dot.className = i <= state.step ? 'dot done' : 'dot';
    dots.append(dot);
  }
  progressBox.append(label, dots);
}

function renderIntro() {
  screen.textContent = '';

  const box = document.createElement('div');
  box.className = 'intro';

  const title = document.createElement('h1');
  title.textContent = QUIZ_TITLE;

  const sub = document.createElement('p');
  sub.textContent = `${QUESTIONS.length} ${plural(QUESTIONS.length, 'вопрос', 'вопроса', 'вопросов')}`
    + ` · ${TIEBREAK.length} ${plural(TIEBREAK.length, 'герой', 'героя', 'героев')}`;

  box.append(title, sub);
  screen.append(box);

  primary.set('Начать', () => { startQuiz('intro'); });
}

// Русские числительные: 1 вопрос, 2 вопроса, 5 вопросов.
/* Один вход на все способы начать: и с приветствия, и «пройти заново», и
   «пройти тест» с чужого результата. Поэтому событие тоже одно, с разным
   source — воронка App Opened → Quiz Started → … собирается целиком,
   независимо от того, как человек пришёл. */
function startQuiz(source, previousHero) {
  analytics.track('Quiz Started', { source, previous_hero: previousHero || null });
  state.shared = null;
  state.step = 0;
  state.picked = [];
  state.startedAt = Date.now();
  render();
}

function plural(n, one, few, many) {
  const mod100 = n % 100;
  if (mod100 >= 11 && mod100 <= 14) return many;
  const mod10 = n % 10;
  if (mod10 === 1) return one;
  if (mod10 >= 2 && mod10 <= 4) return few;
  return many;
}

function renderQuestion() {
  const q = QUESTIONS[state.step];
  screen.textContent = '';

  const title = document.createElement('h1');
  title.className = 'question';
  title.textContent = q.text;
  screen.append(title);

  q.answers.forEach((answer, index) => {
    const btn = document.createElement('button');
    btn.className = 'option' + (state.picked[state.step] === index ? ' selected' : '');
    btn.type = 'button';
    btn.textContent = answer.text;
    btn.addEventListener('click', () => {
      state.picked[state.step] = index;
      haptic('select');
      render();
    });
    screen.append(btn);
  });

  const isLast = state.step === QUESTIONS.length - 1;
  if (state.picked[state.step] === undefined) {
    // Пока вариант не выбран, идти некуда — кнопка остаётся на месте, но гаснет.
    primary.set(isLast ? 'Узнать результат' : 'Дальше', null);
  } else {
    if (isLast) {
      // Файлы тяжёлые, поэтому тянем картинку победителя заранее —
      // пока человек жмёт кнопку, она уже успевает прилететь.
      const img = new Image();
      img.src = CHARACTERS[leader(tally())].img;
    }

    primary.set(isLast ? 'Узнать результат' : 'Дальше', () => {
      // Событие на переходе, а не на клике по варианту: иначе перебор
      // вариантов в одном вопросе давал бы по событию на каждое касание.
      const picked = state.picked[state.step];
      const answer = q.answers[picked];
      analytics.track('Question Answered', {
        question_number: state.step + 1,       // 1..N, как человек их видит
        question_text: q.text,
        answer_number: picked + 1,
        answer_text: answer.text,
        answer_heroes: Object.keys(answer.points || {}),
      });

      state.step += 1;
      if (state.step === QUESTIONS.length) {
        haptic('done');
        trackCompleted();
      }
      render();
    });
  }
}

/* Вызывается из перехода на последнем вопросе, а не из renderResult:
   результат перерисовывается при смене темы, и событие бы дублировалось. */
function trackCompleted() {
  const scores = tally();
  const hero = leader(scores);
  const top = Math.max(...Object.values(scores));
  analytics.track('Quiz Completed', {
    hero,
    hero_name: CHARACTERS[hero].name,
    hero_score: scores[hero],
    // Сколько героев набрали столько же: 1 — чистая победа, больше — ничья,
    // и тогда героя выбрал порядок TIEBREAK, а не ответы.
    tied_at_top: Object.values(scores).filter(v => v === top).length,
    duration_sec: state.startedAt ? Math.round((Date.now() - state.startedAt) / 1000) : null,
    scores,
  });
}

function renderResult() {
  const key = state.shared || leader(tally());
  const character = CHARACTERS[key];
  screen.textContent = '';

  const card = document.createElement('div');
  card.className = 'result';

  const img = document.createElement('img');
  img.className = 'hero';
  img.src = character.img;
  img.alt = character.name;
  // Если картинка не нашлась, вместо битой иконки показываем подпись.
  img.addEventListener('error', () => {
    const stub = document.createElement('div');
    stub.className = 'hero-fallback';
    stub.textContent = 'нет картинки: ' + character.img;
    img.replaceWith(stub);
  });

  const who = document.createElement('p');
  who.className = 'who';
  who.textContent = 'Ты —';

  const name = document.createElement('p');
  name.className = 'name';
  name.textContent = character.name;

  card.append(img, who, name);

  // Описание многоабзацное: пустая строка в конфиге = новый абзац.
  if (character.desc) {
    const desc = document.createElement('div');
    desc.className = 'desc';
    for (const para of character.desc.split(/\n\s*\n/)) {
      const el = document.createElement('p');
      el.textContent = para.trim();
      desc.append(el);
    }
    card.append(desc);
  }

  screen.append(card);

  const share = document.createElement('div');
  share.className = 'share';

  const toChat = document.createElement('button');
  toChat.type = 'button';
  toChat.textContent = 'Поделиться';
  toChat.addEventListener('click', () => shareToChat(key));
  share.append(toChat);

  // Сторис появились в Bot API 7.8 — на старых клиентах кнопки просто нет,
  // показывать неработающую хуже, чем не показывать.
  if (tg.isVersionAtLeast('7.8')) {
    const toStory = document.createElement('button');
    toStory.type = 'button';
    toStory.textContent = 'В сторис';
    toStory.addEventListener('click', () => shareStory(key));
    share.append(toStory);
  }

  screen.append(share);

  primary.set(state.shared ? 'Пройти тест' : 'Пройти заново', () => {
    startQuiz(state.shared ? 'shared_result' : 'restart', key);
  });
}

function render() {
  renderProgress();
  if (state.shared) renderResult();
  else if (state.step === INTRO) renderIntro();
  else if (state.step >= QUESTIONS.length) renderResult();
  else renderQuestion();

  // // Назад есть везде, кроме приветствия.
  // // Вне Telegram BackButton недоступна — не трогаем, чтобы не сорить в консоль.
  // if (insideTelegram) {
  //   if (state.step > INTRO) tg.BackButton.show();
  //   else tg.BackButton.hide();
  // }

  window.scrollTo(0, 0);
}

function goBack() {
  if (state.step === INTRO) return;
  state.step -= 1;
  render();
}

tg.onEvent('backButtonClicked', goBack);

// Пользователь может переключить тему, не выходя из приложения.
// Вне Telegram это событие не приходит, поэтому проверка не нужна.
tg.onEvent('themeChanged', () => {
  if (window.__forcedTheme) return;   // тема зафиксирована через ?theme=
  document.documentElement.dataset.theme = tg.colorScheme;
  analytics.refresh();
});

render();
</script>
</body>
</html>
